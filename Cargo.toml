[package]
name = "vix"
version = "0.1.0"
edition = "2024"
description = "A fast, vim-inspired visual terminal multiplexer"
license = "MIT"
repository = "https://github.com/justamapping/vix"
readme = "README.md"
keywords = ["terminal", "multiplexer", "vim", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
crossterm = "0.29.0"
libc = "0.2.190"
nucleo-matcher = "0.3.1"
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
signal-hook = "0.3"
toml = "1.1.7"
unicode-width = "0.2"
vt100 = "0.16.2"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
